<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>購買申請書 作成ツール</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <style>
        /* 印刷・PDF出力用のスタイル設定 */
        @media print {
            @page {
                size: A4;
                margin: 0; 
            }
            body {
                margin: 0;
                background-color: white !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .no-print {
                display: none !important;
            }
            .print-area-wrapper {
                padding: 0 !important;
                background: white !important;
                display: block !important;
                overflow: visible !important;
            }
            #print-area {
                box-shadow: none !important;
                width: 100% !important;
                max-width: 100% !important;
                padding: 20mm !important;
                margin: 0 !important;
            }
        }

        /* プレビュー画面のスクロールバー */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-10">

    <!-- ヘッダー (スマホでも押しやすいように上部に固定) -->
    <header class="bg-blue-600 text-white p-4 sticky top-0 z-50 shadow-md no-print">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <h1 class="text-base sm:text-lg font-bold flex items-center gap-2">
                <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                購買申請書ツール
            </h1>
            <button onclick="window.print()" class="bg-white text-blue-600 px-3 py-2 rounded text-sm font-bold shadow hover:bg-gray-50 flex items-center gap-1 transition-colors">
                PDF出力
            </button>
        </div>
    </header>

    <div class="max-w-3xl mx-auto p-4 sm:p-6 no-print">
        <p class="text-sm text-gray-600 mb-4 bg-blue-50 p-3 rounded-lg border border-blue-100">
            必要事項を入力してください。ページ下部の「プレビュー」にリアルタイムで反映されます。
        </p>

        <!-- 入力フォームエリア -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 sm:p-6 mb-8">
            <form id="input-form" class="space-y-6">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <!-- 申請日 -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">申請日</label>
                        <!-- text-baseを指定し、スマホでのズームを防止 -->
                        <input type="date" id="in-date" data-bind="out-date" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-base text-gray-700">
                    </div>
                    <!-- 提出先 -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">提出先</label>
                        <input type="text" id="in-destination" data-bind="out-destination" value="財務担当 殿" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-base text-gray-700">
                    </div>
                </div>

                <!-- 部署名・氏名 -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 border-t border-gray-100 pt-5">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">部署名</label>
                        <input type="text" id="in-department" data-bind="out-department" placeholder="例: 営業部" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-base text-gray-700">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">氏名</label>
                        <input type="text" id="in-name" data-bind="out-name" placeholder="例: 山田 太郎" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-base text-gray-700">
                    </div>
                </div>

                <!-- 件名 -->
                <div class="border-t border-gray-100 pt-5">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">件名 (何を購入するか)</label>
                    <input type="text" id="in-subject" data-bind="out-subject" placeholder="例: 開発用ノートPCの購入について" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-base text-gray-700">
                </div>

                <!-- 目的・理由 -->
                <div class="border-t border-gray-100 pt-5">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">購入の目的・理由</label>
                    <textarea id="in-reason" data-bind="out-reason" rows="3" placeholder="現在のPCが老朽化し、業務に支障が出ているため。" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-base text-gray-700"></textarea>
                </div>

                <!-- 明細 (スマホ向けにレイアウト変更) -->
                <div class="border-t border-gray-100 pt-5">
                    <div class="flex justify-between items-end mb-3">
                        <label class="block text-sm font-semibold text-gray-700">購入明細 (最大5件)</label>
                    </div>
                    <div id="items-container" class="space-y-3">
                        <!-- ここにJSで入力行が生成されます -->
                    </div>
                </div>

                <!-- 備考 -->
                <div class="border-t border-gray-100 pt-5">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">備考 (希望支払日、納品先など)</label>
                    <textarea id="in-note" data-bind="out-note" rows="2" placeholder="例: 〇月〇日までに納品希望。" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-base text-gray-700"></textarea>
                </div>
            </form>
        </div>

        <div class="text-center mt-12 mb-4 relative">
            <hr class="border-gray-300 absolute w-full top-1/2 left-0 -z-10">
            <span class="bg-gray-100 px-4 text-gray-500 font-bold tracking-widest">書類プレビュー</span>
            <p class="text-xs text-gray-500 mt-2">表が見切れている場合は左右にスクロールできます</p>
        </div>
    </div>

    <!-- 下部：プレビューエリア (横スクロール対応) -->
    <main class="w-full overflow-x-auto print-area-wrapper py-6">
        <div class="flex justify-center min-w-max px-4">
            
            <!-- 実際の書類部分 (A4縦サイズ相当) -->
            <div id="print-area" class="bg-white w-[210mm] min-h-[297mm] p-[20mm] shadow-xl text-black font-serif relative">
                
                <!-- ヘッダー部分 -->
                <div class="flex justify-between items-end mb-8">
                    <div class="w-1/3"></div>
                    <div class="w-1/3 text-center">
                        <h2 class="text-3xl font-bold tracking-[0.2em] border-b-2 border-black pb-1 inline-block">購買申請書</h2>
                    </div>
                    <div class="w-1/3 text-right">
                        <p class="text-sm">申請日：<span id="out-date" class="inline-block min-w-[120px] border-b border-gray-800 text-center"></span></p>
                    </div>
                </div>

                <!-- 宛先と申請者、ハンコ枠 -->
                <div class="flex justify-between items-start mb-8">
                    <div class="pt-4">
                        <p class="text-xl font-bold border-b border-black pb-1 inline-block min-w-[150px]" id="out-destination">財務担当 殿</p>
                    </div>
                    
                    <div class="flex items-start gap-6">
                        <!-- 申請者情報 -->
                        <div class="text-sm pt-2">
                            <p class="mb-2">部署名：<span id="out-department" class="inline-block min-w-[150px] border-b border-dotted border-gray-500"></span></p>
                            <p>氏　名：<span id="out-name" class="inline-block min-w-[150px] border-b border-dotted border-gray-500"></span></p>
                        </div>
                        
                        <!-- 決裁印枠 -->
                        <table class="border-collapse border border-black text-center text-sm bg-white">
                            <tr>
                                <td class="border border-black w-16 py-1 bg-gray-100">承認</td>
                                <td class="border border-black w-16 py-1 bg-gray-100">確認</td>
                                <td class="border border-black w-16 py-1 bg-gray-100">作成</td>
                            </tr>
                            <tr>
                                <td class="border border-black h-16 relative"><span class="absolute bottom-1 right-1 text-[10px] text-gray-300">印</span></td>
                                <td class="border border-black h-16 relative"><span class="absolute bottom-1 right-1 text-[10px] text-gray-300">印</span></td>
                                <td class="border border-black h-16 relative"><span class="absolute bottom-1 right-1 text-[10px] text-gray-300">印</span></td>
                            </tr>
                        </table>
                    </div>
                </div>

                <p class="mb-4">下記の通り、物品の購入を申請いたします。</p>

                <!-- 基本情報テーブル -->
                <table class="w-full mb-8 border-collapse border border-black">
                    <tr>
                        <th class="border border-black bg-gray-100 py-3 px-4 text-left w-32 font-bold">件名</th>
                        <td class="border border-black py-3 px-4" id="out-subject"></td>
                    </tr>
                    <tr>
                        <th class="border border-black bg-gray-100 py-3 px-4 text-left align-top h-32 font-bold">目的・理由</th>
                        <td class="border border-black py-3 px-4 align-top whitespace-pre-wrap leading-relaxed" id="out-reason"></td>
                    </tr>
                    <tr>
                        <th class="border border-black bg-gray-100 py-3 px-4 text-left font-bold text-lg">合計金額</th>
                        <td class="border border-black py-3 px-4 font-bold text-2xl text-right tracking-wider" id="out-total-amount">¥ 0</td>
                    </tr>
                </table>

                <!-- 購入明細 -->
                <h3 class="font-bold text-lg mb-2 flex items-center before:content-['■'] before:mr-2">購入明細</h3>
                <table class="w-full mb-8 border-collapse border border-black text-sm">
                    <thead>
                        <tr>
                            <th class="border border-black bg-gray-100 py-2 w-10 text-center">No</th>
                            <th class="border border-black bg-gray-100 py-2 text-center">品名・型番等</th>
                            <th class="border border-black bg-gray-100 py-2 w-20 text-center">数量</th>
                            <th class="border border-black bg-gray-100 py-2 w-28 text-center">単価</th>
                            <th class="border border-black bg-gray-100 py-2 w-36 text-center">金額</th>
                        </tr>
                    </thead>
                    <tbody id="out-items-container">
                        <!-- JSで生成 -->
                    </tbody>
                </table>

                <!-- 備考 -->
                <h3 class="font-bold text-lg mb-2 flex items-center before:content-['■'] before:mr-2">備考</h3>
                <div class="border border-black h-28 p-4 whitespace-pre-wrap leading-relaxed" id="out-note"></div>

            </div>
        </div>
    </main>

    <!-- 最下部の大きな印刷ボタン -->
    <div class="max-w-3xl mx-auto px-4 mt-8 mb-16 no-print">
        <button onclick="window.print()" class="w-full bg-blue-600 text-white py-4 px-4 rounded-xl font-bold text-lg hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 transition-all shadow-lg flex justify-center items-center gap-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
            PDFで出力 / 印刷する
        </button>
    </div>

    <script>
        const NUM_ITEMS = 5;

        function initApp() {
            const inContainer = document.getElementById('items-container');
            const outContainer = document.getElementById('out-items-container');

            for (let i = 1; i <= NUM_ITEMS; i++) {
                // スマホ向けに入力しやすいカード型レイアウトに変更
                inContainer.innerHTML += `
                    <div class="bg-gray-50 border border-gray-200 rounded-lg p-3 sm:p-4 relative">
                        <div class="absolute top-0 left-0 bg-gray-200 text-gray-600 text-xs font-bold px-2 py-1 rounded-br-lg rounded-tl-lg">明細 ${i}</div>
                        <div class="mt-4 mb-3">
                            <input type="text" id="in-item-${i}" placeholder="品名・型番など" class="w-full text-base border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500" oninput="updateItem(${i})">
                        </div>
                        <div class="flex gap-3">
                            <div class="w-1/3">
                                <label class="block text-xs text-gray-500 mb-1">数量</label>
                                <input type="number" id="in-qty-${i}" placeholder="0" min="0" class="w-full text-base border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500" oninput="updateItem(${i})">
                            </div>
                            <div class="w-2/3">
                                <label class="block text-xs text-gray-500 mb-1">単価 (円)</label>
                                <input type="number" id="in-price-${i}" placeholder="0" min="0" class="w-full text-base border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500" oninput="updateItem(${i})">
                            </div>
                        </div>
                    </div>
                `;

                // プレビュー側の行生成
                outContainer.innerHTML += `
                    <tr>
                        <td class="border border-black py-2 h-10 text-center">${i}</td>
                        <td class="border border-black py-2 px-3" id="out-item-${i}"></td>
                        <td class="border border-black py-2 px-3 text-right" id="out-qty-${i}"></td>
                        <td class="border border-black py-2 px-3 text-right" id="out-price-${i}"></td>
                        <td class="border border-black py-2 px-3 text-right font-semibold" id="out-amount-${i}"></td>
                    </tr>
                `;
            }

            // 初期値の設定
            const today = new Date().toISOString().split('T')[0];
            const dateInput = document.getElementById('in-date');
            dateInput.value = today;
            updateDateDisplay(today);
            document.getElementById('out-destination').textContent = document.getElementById('in-destination').value;

            // バインディング処理
            document.querySelectorAll('[data-bind]').forEach(el => {
                el.addEventListener('input', (e) => {
                    const targetId = e.target.getAttribute('data-bind');
                    const targetEl = document.getElementById(targetId);
                    
                    if (targetEl) {
                        if (e.target.type === 'date') {
                            updateDateDisplay(e.target.value);
                        } else {
                            targetEl.textContent = e.target.value;
                        }
                    }
                });
            });
        }

        function updateDateDisplay(dateStr) {
            if(!dateStr) {
                document.getElementById('out-date').textContent = '';
                return;
            }
            const d = new Date(dateStr);
            const formatted = `${d.getFullYear()}年 ${d.getMonth() + 1}月 ${d.getDate()}日`;
            document.getElementById('out-date').textContent = formatted;
        }

        function updateItem(index) {
            const name = document.getElementById(`in-item-${index}`).value;
            const qty = document.getElementById(`in-qty-${index}`).value;
            const price = document.getElementById(`in-price-${index}`).value;

            document.getElementById(`out-item-${index}`).textContent = name;
            document.getElementById(`out-qty-${index}`).textContent = qty;
            
            if (price) {
                document.getElementById(`out-price-${index}`).textContent = '¥ ' + Number(price).toLocaleString();
            } else {
                document.getElementById(`out-price-${index}`).textContent = '';
            }

            let amount = 0;
            if (qty && price) {
                amount = Number(qty) * Number(price);
                document.getElementById(`out-amount-${index}`).textContent = '¥ ' + amount.toLocaleString();
            } else {
                document.getElementById(`out-amount-${index}`).textContent = '';
            }

            calcTotal();
        }

        function calcTotal() {
            let total = 0;
            for (let i = 1; i <= NUM_ITEMS; i++) {
                const qty = document.getElementById(`in-qty-${i}`).value;
                const price = document.getElementById(`in-price-${i}`).value;
                if (qty && price) {
                    total += Number(qty) * Number(price);
                }
            }
            document.getElementById('out-total-amount').textContent = '¥ ' + total.toLocaleString();
        }

        window.onload = initApp;
    </script>
</body>
</html>
