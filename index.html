<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>財務フォーム</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <link rel="stylesheet" href="styles.css">
    
</head>
<body>

    <header class="header">
        <h1>財務フォーム</h1>
        <div class="header-actions">
            <button class="btn btn-secondary" onclick="exportDocument('jpg')">JPG出力</button>
            <button class="btn btn-primary" onclick="exportDocument('pdf')">PDF出力</button>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <h2 class="section-title">書類の種類と情報入力</h2>
            <div class="doc-types" id="doc-type-buttons"></div>
            
            <div class="form-grid" id="dynamic-form-fields"></div>

            <div class="input-table-wrapper">
                <table class="input-table">
                    <thead id="item-list-head"></thead>
                    <tbody id="item-list-body"></tbody>
                </table>
            </div>

            <div style="margin-top: 1rem; text-align: right;">
                <button class="btn btn-outline" onclick="addItemRow()">＋ 明細行を追加</button>
            </div>
        </section>

        <section>
            <h2 class="section-title" style="margin-bottom: 0.5rem;">出力プレビュー</h2>
            <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1rem;">※印刷を想定したA4実寸比率です。PDF出力時、枠に収まらない要素は自動で次ページに分割されます。</p>
            
            <div class="preview-wrapper" id="preview-wrapper">
                <div class="a4-paper" id="document-preview"></div>
            </div>
            
            <div class="footer-actions" style="margin-top: 1.5rem; justify-content: center;">
                <button class="btn btn-secondary" onclick="exportDocument('jpg')">JPGとしてダウンロード</button>
                <button class="btn btn-primary" style="padding-left: 2rem; padding-right: 2rem;" onclick="exportDocument('pdf')">PDFとして出力・ダウンロード</button>
            </div>
        </section>
    </main>

<script src="script.js" defer></script>

</body>

</html>
